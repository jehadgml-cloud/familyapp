<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنت غير متصل بالإنترنت</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        h1 {
            font-size: 1.25rem;
            color: #1e293b;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .retry-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .retry-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 3rem; margin-bottom: 15px;">📡</div>
        <h1>انقطع الاتصال بالإنترنت</h1>
        <p>يرجى التحقق من اتصال جهازك بالواي فاي أو بيانات الهاتف المحمول. لمنع حدوث تضارب في البيانات، لا يمكن حفظ التقارير أو تغيير حالتها أثناء عدم وجود اتصال بالشبكة.</p>
        <button class="retry-btn" onclick="window.location.reload()">تحديث الصفحة</button>
    </div>
</body>
</html>
